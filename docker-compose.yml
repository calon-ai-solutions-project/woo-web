services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
      - mailpit
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Local only: theme changes such as new block patterns show without a version bump.
      WORDPRESS_CONFIG_EXTRA: define( 'WP_DEVELOPMENT_MODE', 'theme' );
      # Local only: the site's emails go to Mailpit at http://localhost:8025.
      CLO_SMTP_HOST: mailpit
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/clo-child:/var/www/html/wp-content/themes/clo-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: define( 'WP_DEVELOPMENT_MODE', 'theme' );
      CLO_SMTP_HOST: mailpit
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/clo-child:/var/www/html/wp-content/themes/clo-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts
    entrypoint: ["wp"]
    profiles: ["tools"]

  # Catches every email the local site sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db_data:
  wp_data:
